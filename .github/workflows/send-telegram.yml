name: Send Telegram HTML

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "futbol/futbol.html"
      - "basketbol/basketbol.html"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed HTML files
        id: detect
        run: |
          ALL_CHANGED=$(git diff --name-only HEAD~1 HEAD)
          printf '%s\n' "$ALL_CHANGED" > all-changed.txt
          CHANGED_FILES=$(printf '%s\n' "$ALL_CHANGED" | grep -E '^(futbol/futbol\.html|basketbol/basketbol\.html)$' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$CHANGED_FILES" > changed.txt
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Send changed HTML files via Telegram
        if: steps.detect.outputs.found == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Europe/Istanbul
        run: |
          while read FILE; do
            [ -f "$FILE" ] || continue
            BASENAME=$(basename "$FILE")

            if [[ "$FILE" == futbol/futbol.html ]]; then
              ICON="⚽"
              SPORT="futbol"
            else
              ICON="🏀"
              SPORT="basketbol"
            fi

            # CONTROL commitlerinde değişen RealScores dosyası kontrol edilen günü taşır.
            # Daily commitlerinde PredictionData dosyası tahmin gününü taşır.
            DATE=$(grep -E "^${SPORT}/data/RealScores-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$" all-changed.txt \
              | sed -E 's/.*RealScores-([0-9]{4}-[0-9]{2}-[0-9]{2})\.json/\1/' | tail -1)
            if [ -z "$DATE" ]; then
              DATE=$(grep -E "^${SPORT}/data/PredictionData-[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$" all-changed.txt \
                | sed -E 's/.*PredictionData-([0-9]{4}-[0-9]{2}-[0-9]{2})\.json/\1/' | tail -1)
            fi

            if [ -n "$DATE" ]; then
              DISPLAY_DATE=$(date -d "$DATE" +'%d.%m.%Y')
            else
              DISPLAY_DATE=$(date +'%d.%m.%Y')
            fi

            CAPTION="$ICON $BASENAME - $DISPLAY_DATE"
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument" \
              -F chat_id="$TELEGRAM_CHAT_ID" \
              -F document="@$FILE" \
              -F caption="$CAPTION"
          done < changed.txt
