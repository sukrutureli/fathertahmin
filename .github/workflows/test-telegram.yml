name: Test Telegram Rate Limit (50 Messages)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-notifications
  cancel-in-progress: false

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Send 50 dummy Telegram messages with retry
        shell: bash
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo 'Missing Telegram secrets' >&2
            exit 1
          fi

          send_with_retry() {
            local text="$1" response_file http_code retry_after attempt=1 max_attempts=8
            response_file=$(mktemp)
            trap 'rm -f "$response_file"' RETURN
            while (( attempt <= max_attempts )); do
              http_code=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
                --connect-timeout 15 --max-time 60 -X POST \
                "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=${text}") || http_code=000
              if [[ "$http_code" == 2* ]]; then
                return 0
              fi
              if [[ "$http_code" == 429 ]]; then
                retry_after=$(python3 - "$response_file" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding='utf-8') as f:
                  print(max(1, int(json.load(f).get('parameters', {}).get('retry_after', 10))))
          except Exception:
              print(10)
          PY
                )
                echo "429 rate limit: waiting ${retry_after}s (attempt ${attempt}/${max_attempts})"
                sleep "$retry_after"
              elif [[ "$http_code" == 400 || "$http_code" == 401 || "$http_code" == 403 || "$http_code" == 404 ]]; then
                echo "Non-retryable Telegram HTTP ${http_code}:"
                cat "$response_file"
                return 1
              else
                echo "Telegram HTTP ${http_code}; retry ${attempt}/${max_attempts}"
                sleep $((attempt * 5))
              fi
              attempt=$((attempt + 1))
            done
            echo "Failed after ${max_attempts} attempts" >&2
            cat "$response_file" >&2
            return 1
          }

          for i in $(seq 1 50); do
            printf 'Sending dummy message %02d/50\n' "$i"
            send_with_retry "🧪 Telegram 429 testi — mesaj ${i}/50 (dummy; gerçek tahmin değildir)"
            printf 'Sent %02d/50\n' "$i"
            if (( i < 50 )); then sleep 2; fi
          done
          echo 'All 50 dummy messages sent successfully.'
